name: UNDERCRYPT 8XP build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CEdev
        run: |
          curl -fL -o "$HOME/cedev.tar.gz" \
            https://github.com/CE-Programming/toolchain/releases/latest/download/CEdev-Linux.tar.gz
          tar -xzf "$HOME/cedev.tar.gz" -C "$HOME"
          echo "CEDEV=$HOME/CEdev" >> "$GITHUB_ENV"
          echo "$HOME/CEdev/bin" >> "$GITHUB_PATH"

      - name: Build UNDERCRYPT
        run: make

      - name: Enforce 75 KiB program limit
        run: |
          test -s bin/UNDERCRY.8xp
          size=$(wc -c < bin/UNDERCRY.8xp)
          echo "UNDERCRY.8xp size: ${size} bytes"
          if [ "$size" -gt 76800 ]; then
            echo "Build exceeds the 75 KiB limit."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: UNDERCRYPT-8XP
          path: bin/UNDERCRY.8xp
          if-no-files-found: error
